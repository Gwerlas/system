---
# For feature flipping purpose
in_container: "{{ 'container' in ansible_facts.virtualization_tech_guest }}"
is_desktop: "{{ 'desktop' in system_profile }}"
use_lvm: "{{ system_manage_storages and (system_storages_vg | length) > 0 }}"

################
### Packages ###
################

# Under automatic mode, we use binaries
packages_build: "{{ false if system_packages_build == 'auto' else system_packages_build }}"

# Maximum accepted age of the package manager index, in days, `never` being
# a deliberate freeze. Under automatic mode we follow the package manager,
# whose repositories decide how fast an index goes stale; an explicit user
# value always wins, because a site running its own repositories may hold
# them still on purpose and the role cannot know it.
packages_cache_age: |-
  {{
    default_packages_cache_age if system_packages_cache_age == 'auto'
    else 'never' if (system_packages_cache_age is boolean and not system_packages_cache_age)
    else system_packages_cache_age
  }}

# The rule behind the automatic mode: most repositories keep the current
# version of a package and nothing else, so an index older than a day already
# risks pointing at files the mirror has dropped. A vars/<pkg_mgr>.yml only
# restates this when its manager departs from it — pacman because a refresh is
# cheaper than the rule, dnf because its repositories can afford more.
default_packages_cache_age: 1

# Every profile the role knows about. A `system_profile` is a `/` separated
# path, each segment naming one of these keys; `all` is added to every path,
# so there is no point naming it. An entry holds what its profile adds —
# packages, services — and stays empty when the profile brings nothing beyond
# the `vars/<profile>.yml` file `tasks/facts.yml` loads for it.
#
# This is also the list an unknown segment is reported against, so a profile
# missing from here does not exist as far as the role is concerned, whatever
# else it may have in `vars/`.
profiles:
  all:
    packages:
      - acl
      - sudo
      - rsync
  desktop:
    packages:
      - libreoffice
      - firefox
      - usbutils
  gnome:
    packages:
      - baobab
      - eog
      - evince
      - file-roller
      - gdm
      - gnome-backgrounds
      - gnome-console
      - gnome-online-accounts
      - gnome-screenshot
      - gnome-session
      - gnome-shell
      - gnome-software
      - gnome-text-editor
      - nautilus
      - seahorse
    services:
      - gdm
  # A hardened sshd, from vars/hardened.yml.
  hardened: {}
  # The default; `all` already carries what every machine gets.
  server: {}

current_profiles: "{{ system_profile | split('/') }}"

# Segments of `system_profile` matching no profile. `current_profiles_values`
# resolves through `intersect`, which drops whatever it does not recognise
# without a word, so `desktop/gnom` would install the generic desktop packages
# and report success. tasks/facts.yml reports these instead of losing them.
# `difference` goes through a set, whose order varies from run to run, hence
# the sort: the report has to read the same twice in a row.
unknown_profiles: "{{ current_profiles | difference(profiles.keys()) | sort }}"

# FIXME use the vars/<profile>.yml file
current_profiles_values: |
  {{
    (['all'] + current_profiles) |
    intersect(profiles.keys()) |
    map('extract', profiles)
  }}

# CA Certificates
ca_certificates:
  bundle: /etc/ssl/certs/ca-certificates.crt
  path: /usr/local/share/ca-certificates
  command: update-ca-certificates

################
## Networking ##
################

# Under automatic mode we follow the host: a machine already configured keeps
# the tooling it runs, so an upgrade touching no variable changes nothing.
# Naming a backend explicitly installs it.
network_backend_name: |-
  {{
    detected_network_backend if system_network_backend == 'auto'
    else system_network_backend
  }}

network_backend: "{{ network_backends[network_backend_name] }}"

# Backends are named after the format they write, never after the software
# reading it: NetworkManager reads two of these, and `networkd` is written by
# netplan as well as by hand.
#
# `service` is mandatory: it is what the `restart network service` handler
# restarts. A `%s` in it stands for an interface name, for a backend carrying
# one unit per interface rather than one for all of them.
#
# `apply` replaces that restart wherever restarting is not what applies the
# configuration.
#
# `packages` is what naming the backend installs, resolved through the same
# family translation as any other package key. `template` is optional — a
# backend configuring every interface through a single file writes it from its
# own tasks/networks/<name>.yml — and its `mode` defaults to 0644.
network_backends:
  eni:
    packages:
      - ifupdown
    service: networking
    template:
      src: network/interfaces.d/netiface.j2
      dest: /etc/network/interfaces.d/%s
  keyfile:
    packages:
      - NetworkManager
    service: NetworkManager.service
    template:
      src: NetworkManager/system-connections/nmconnection.j2
      dest: /etc/NetworkManager/system-connections/%s.nmconnection
      # NetworkManager refuses to load a connection file others can read, and
      # a keyfile is where a wifi passphrase or an 802.1x secret would sit.
      mode: "0600"
  netifrc:
    packages:
      - netifrc
    service: net.%s
  netplan:
    packages:
      - netplan.io
    service: systemd-networkd.service
    apply: netplan apply
    template:
      src: netplan/netiface.yaml.j2
      # Numbered so the role's files win over the distribution's own, which
      # ship as 50-cloud-init.yaml and friends.
      dest: /etc/netplan/90-%s.yaml
      # netplan refuses to read a file others can read, since 0.106.
      mode: "0600"
  networkd:
    service: systemd-networkd.service
    template:
      src: systemd/network/netiface.network.j2
      dest: /etc/systemd/network/%s.network
  sysconfig:
    packages:
      - NetworkManager
    service: NetworkManager.service
    template:
      src: sysconfig/network-scripts/ifcfg.j2
      dest: /etc/sysconfig/network-scripts/ifcfg-%s

# NetworkManager's package name by family, for the detection in
# tasks/facts.yml — which runs before the package translation is usable.
network_manager_packages:
  - NetworkManager
  - network-manager
  - networkmanager

# Network types
networks_types:
  bridge:
    packages:
      - bridge-utils

current_network_types: |
  {{
    system_networks_interfaces |
    selectattr('type', 'defined') |
    map(attribute='type') |
    map('lower') |
    unique |
    intersect(networks_types.keys()) |
    map('extract', networks_types)
  }}

############
### SSHd ###
############

# An explicit true or false deliberately skips the container test: forcing it
# is how a user says their container is the exception.
#
# `hardened` counts as an instruction because it carries its configuration in
# vars/hardened.yml, never in system_sshd_config: the length test alone would
# leave sshd unmanaged for the one profile that exists to configure it.
manage_sshd: |-
  {{
    (
      not in_container and
      (system_sshd_config | length > 0 or 'hardened' in current_profiles)
    )
    if system_manage_sshd == 'auto' else system_manage_sshd
  }}

# sshd's compile-time default is `UsePAM no`, but all major distros ship
# their stock sshd_config with `UsePAM yes`. Without it, cloud-init users
# whose `/etc/shadow` password is `*` (locked) are refused even via pubkey,
# because sshd falls back to the raw shadow check. Keep PAM on by default.
sshd_config:
  UsePAM: true

################
###   Time   ###
################

# The name of the current NTP engine, use this variables in tasks and handlers.
# Do not use default_time_backend_name unless you know what You're doing.
time_backend_name: "{{ system_time_backend | default(default_time_backend_name | default('')) }}"

# The current NTP engine, prefer this variable in tasks and handlers
# and use its properties (services, templates).
time_backend: "{{ time_backends[time_backend_name] }}"

# NTP engines properties, use this variable in your tasks and handlers and not
# default_time_backends.
time_backends: "{{ default_time_backends }}"

# Defaults NTP engines properties, use it only to fill the time_backends variable.
default_time_backends:
  chrony:
    services:
      - chronyd
    templates:
      - chrony.conf
  ntp:
    services:
      - ntpd
    templates:
      - ntp.conf
  systemd-timesyncd:
    services:
      - systemd-timesyncd
    templates:
      - systemd/timesyncd.conf

# NTP engines supported by the current node
supported_time_backends: |
  {{
    time_backends |
    dict2items |
    rejectattr('key', 'in', masks.time_backends | default([])) |
    items2dict
  }}

################
#### Users #####
################

groups_present: |
  {{
    (system_users_groups | selectattr('state', 'undefined'))
  + (system_users_groups | selectattr('state', 'defined') | selectattr('state', '!=', 'absent'))
  }}

groups_absent: |
  {{
    system_users_groups |
    selectattr('state', 'defined') |
    selectattr('state', '==', 'absent')
  }}

users_present: |
  {{
    (system_users | selectattr('state', 'undefined'))
  + (system_users | selectattr('state', 'defined') | selectattr('state', '==', 'present'))
  }}

users_shells: |
  {{
    users_present |
    rejectattr('system', 'defined') |
    selectattr('shell', 'defined') |
    map(attribute='shell') |
    map('basename') |
    sort |
    unique
  }}
