---
# Loaded after the distribution's files, so this dict replaces
# `vars/debian-like.yml`'s instead of merging with it. Hence `UsePAM`,
# repeated here for the reason vars/main.yml gives, and hence no `Include`:
# dropping it is deliberate, docs/remote-access.md says what it costs.
sshd_config:
  UsePAM: true
  PubkeyAuthentication: true
  AllowAgentForwarding: false
  PermitRootLogin: prohibit-password
  PubkeyAcceptedAlgorithms:
    - ssh-ed25519-cert-v01@openssh.com
    - sk-ssh-ed25519-cert-v01@openssh.com
    - ssh-ed25519
    - sk-ssh-ed25519@openssh.com
  PubkeyAcceptedKeyTypes:
    - ssh-ed25519-cert-v01@openssh.com
    - ssh-ed25519
  PasswordAuthentication: false
  PermitEmptyPasswords: false
  KbdInteractiveAuthentication: false
  ChallengeResponseAuthentication: false
  UseDNS: false
  X11Forwarding: false
  MaxAuthTries: 2
  AllowTcpForwarding: false
