---
- name: Verify role for Stream distributions
  hosts: all
  tasks:
    - name: Rsync
      ansible.posix.synchronize:
        src: verify.yml
        dest: /tmp/verify.yml

    - name: Time synchronisation with timedatectl
      when: ansible_facts.service_mgr == 'systemd'
      ansible.builtin.command:
        cmd: timedatectl
      register: result
      until: "'synchronized: yes' in result.stdout"
      changed_when: false

    - name: Time synchronisation with chronyc
      when: ansible_facts.service_mgr == 'openrc'
      ansible.builtin.command:
        cmd: chronyc sourcestats
      changed_when: false

- name: Check for the Guru Gentoo overlay
  hosts: gentoo
  tasks:
    - name: Check for file
      ansible.builtin.stat:
        path: /data/guru
      register: result
      failed_when: not result.stat.exists

# The scenario asks for vanilla-kernel on an image that ships gentoo-kernel, so
# it converges the flavour switch. Two flavours left installed would collide on
# /usr/src/linux-<version> at the next version bump (#34).
- name: Check a single dist-kernel flavour is left
  hosts: gentoo
  tasks:
    - name: List the installed sys-kernel packages
      ansible.builtin.command:
        cmd: qlist -IC sys-kernel/
      changed_when: false
      register: sys_kernel

    - name: Only the requested flavour is installed
      vars:
        flavours: >-
          {{
            sys_kernel.stdout_lines | map('basename')
            | select('search', '-kernel')
          }}
      ansible.builtin.assert:
        that: flavours == ['vanilla-kernel']
        fail_msg: "dist-kernel flavours installed: {{ flavours }}"

# The scenario runs vanilla-kernel, whose source tree is plain linux-<version>
# — the flavour the hardcoded -gentoo-dist suffix used to miss, leaving a
# dangling symlink that only surfaced in whatever needed the sources (#36).
- name: Check the kernel sources symlink
  hosts: gentoo
  tasks:
    - name: Follow /usr/src/linux
      ansible.builtin.stat:
        path: /usr/src/linux
        follow: true
      register: kernel_sources_link

    - name: It resolves to a source tree
      ansible.builtin.assert:
        that:
          - kernel_sources_link.stat.exists
          - kernel_sources_link.stat.isdir
        fail_msg: /usr/src/linux does not resolve to a directory
