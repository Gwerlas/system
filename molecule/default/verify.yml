---
- name: Verify role with the server profile (default)
  hosts: all
  tasks:
    - name: Rsync
      ansible.posix.synchronize:
        src: verify.yml
        dest: /tmp/verify.yml

    - name: Check host FQDN
      ansible.builtin.assert:
        quiet: true
        that:
          - ansible_facts.fqdn == inventory_hostname + '.localdomain'

    - name: System tools
      ansible.builtin.command:
        cmd: "{{ command }}"
      changed_when: false
      loop:
        - setfacl --version
      loop_control:
        loop_var: command

    - name: Time synchronisation with timedatectl
      when: ansible_facts.service_mgr == "systemd"
      ansible.builtin.command:
        cmd: timedatectl
      register: result
      until: "'synchronized: yes' in result.stdout"
      changed_when: false

    - name: Time synchronisation with chronyc
      when: ansible_facts.service_mgr == 'openrc'
      ansible.builtin.command:
        cmd: chronyc sourcestats
      changed_when: false

    - name: Package installation
      become: true
      ansible.builtin.package:
        name: vim

    # The eclean-kernel handler reads /boot's zstd initramfs through this
    # module; without it the whole play fails. See tasks/packages/portage/kernel.yml.
    - name: Kernel cleanup can read a zstd initramfs
      when: ansible_facts.pkg_mgr == 'portage'
      ansible.builtin.command:
        cmd: python3 -c "import zstandard"
      changed_when: false

    - name: EPEL should be absent
      check_mode: true
      ansible.builtin.file:
        path: /etc/yum.repos.d/epel.repo
        state: absent

# prepare.yml started the guest one kernel behind the tree's newest, and the
# role ran without system_packages_upgrade: the kernel stays, and what the role
# derives from its version follows the installed kernel, not the tree.
- name: Check the kernel version the role worked on
  hosts: gentoo
  tasks:
    - name: Installed kernel
      ansible.builtin.command:
        cmd: portageq best_version / sys-kernel/gentoo-kernel-bin
      register: installed_kernel
      changed_when: false

    - name: Newest kernel in the tree
      ansible.builtin.command:
        cmd: portageq best_visible / sys-kernel/gentoo-kernel-bin
      register: newest_kernel
      changed_when: false

    - name: Follow /usr/src/linux
      ansible.builtin.stat:
        path: /usr/src/linux
      register: kernel_sources_link

    - name: Savedconfig for the newest kernel
      ansible.builtin.stat:
        path: /etc/portage/savedconfig/sys-kernel/{{ newest_kernel.stdout | basename }}
      register: newest_savedconfig

    - name: The installed kernel is still behind, and nothing targets the newest
      vars:
        installed_version: >-
          {{ installed_kernel.stdout | regex_replace('^sys-kernel/gentoo-kernel-bin-', '') }}
        source_version: "{{ installed_version | replace('_p', '-p') }}"
      ansible.builtin.assert:
        that:
          - installed_kernel.stdout != newest_kernel.stdout
          - kernel_sources_link.stat.lnk_target is match('linux-' ~ source_version ~ '(-|$)')
          - not newest_savedconfig.stat.exists
        fail_msg: >-
          installed {{ installed_kernel.stdout }}, tree {{ newest_kernel.stdout }},
          /usr/src/linux -> {{ kernel_sources_link.stat.lnk_target | default('none') }},
          savedconfig for the newest kernel present: {{ newest_savedconfig.stat.exists }}
