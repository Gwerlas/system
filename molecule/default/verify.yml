---
- name: Verify role with the server profile (default)
  hosts: all
  tasks:
    - name: Rsync
      ansible.posix.synchronize:
        src: verify.yml
        dest: /tmp/verify.yml

    - name: Check host FQDN
      ansible.builtin.assert:
        quiet: true
        that:
          - ansible_facts.fqdn == inventory_hostname + '.localdomain'

    - name: System tools
      ansible.builtin.command:
        cmd: "{{ command }}"
      changed_when: false
      loop:
        - setfacl --version
      loop_control:
        loop_var: command

    - name: Time synchronisation with timedatectl
      when: ansible_facts.service_mgr == "systemd"
      ansible.builtin.command:
        cmd: timedatectl
      register: result
      until: "'synchronized: yes' in result.stdout"
      changed_when: false

    - name: Time synchronisation with chronyc
      when: ansible_facts.service_mgr == 'openrc'
      ansible.builtin.command:
        cmd: chronyc sourcestats
      changed_when: false

    - name: Package installation
      become: true
      ansible.builtin.package:
        name: vim

    # The eclean-kernel handler reads /boot's zstd initramfs through this
    # module; without it the whole play fails. See tasks/packages/portage/kernel.yml.
    - name: Kernel cleanup can read a zstd initramfs
      when: ansible_facts.pkg_mgr == 'portage'
      ansible.builtin.command:
        cmd: python3 -c "import zstandard"
      changed_when: false

    - name: EPEL should be absent
      check_mode: true
      ansible.builtin.file:
        path: /etc/yum.repos.d/epel.repo
        state: absent
