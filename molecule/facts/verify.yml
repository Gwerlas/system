---
- name: Verify facts gathered by the role
  hosts: all
  vars:
    system_sequence:
      - facts
  roles:
    - role: gwerlas.system
  post_tasks:
    # What each image actually runs, measured 2026-08-31. This is the
    # regression test for the detection: an image changing its networking
    # tooling has to be seen here rather than in a silent misconfiguration.
    - name: The detected network backend matches the image
      vars:
        expected:
          archlinux: networkd
          bookworm: netplan
          trixie: netplan
          jammy: netplan
          noble: netplan
          centos9s: sysconfig
          alma9: sysconfig
          centos10s: keyfile
          alma10: keyfile
          fedora43: keyfile
          fedora44: keyfile
          gentoo: networkd
      ansible.builtin.assert:
        quiet: true
        that:
          - system_facts.network_backend == expected[inventory_hostname]
        fail_msg: >-
          {{ inventory_hostname }} resolves to '{{ system_facts.network_backend }}',
          the table expects '{{ expected[inventory_hostname] }}'

    - name: Required facts are defined
      ansible.builtin.assert:
        quiet: true
        that:
          - system_kernel is defined
          - system_kernel is match('^[0-9]+\.[0-9]+')
          - system_mounts is defined
          - system_mounts is iterable
          - system_needs_reboot is defined
          - system_needs_reboot is boolean
          - system_packages is defined
          - system_packages is iterable
          - system_shells is defined
          - system_shells is iterable
          - system_services is defined
          - system_services is iterable
          - system_services_dict is defined
          - system_services_dict is mapping

    - name: Bare-metal facts are defined (not in a container)
      ansible.builtin.assert:
        quiet: true
        that:
          - system_uptime is defined
          - system_uptime | int > 0
          - system_boot_mode is defined
          - system_boot_mode in ['efi', 'pc']

    - name: Portage-specific facts are defined
      when: ansible_facts.pkg_mgr == 'portage'
      ansible.builtin.assert:
        quiet: true
        that:
          - system_portage_kernel is defined
          - system_portage_kernel != 'auto'
          # `auto` must not resolve to the source flavour while the rest of
          # the role pulls binary packages, or the play compiles a kernel for
          # 45 minutes on a cloud image.
          - not (system_portage_use_bin_suffix | bool
                 and system_portage_kernel == 'gentoo-kernel')
