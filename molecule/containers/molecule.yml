---
# Shared configuration of every container-based scenario: `containers-facts`
# and `pkg-mgrs-only` symlink their `molecule.yml` here, the same way the VM
# scenarios symlink `default/molecule.yml`. It plays for the containers what
# `shared/platforms.yml` plays for the VMs: the single list of distributions
# tested on the gwerlas/ansible-guest-* images.
dependency:
  name: galaxy
driver:
  name: containers
# The images already ship the unprivileged `ansible` sudoer we connect as,
# hence `pre_build_image: true` (no local rebuild).
#
# `override_command: false` keeps each image's own `CMD` (systemd) instead of
# the driver's `sleep` loop, and `systemd: always` makes Podman set up the
# cgroup/tmpfs mounts systemd needs. Without both, PID 1 is a shell, Ansible
# reports no service manager, and the role's `vars/systemd.yml` never loads —
# `time_backend` then resolves to an undefined key and the facts task fails.
platforms:
  - name: archlinux
    image: docker.io/gwerlas/ansible-guest-archlinux:latest
    pre_build_image: true
    override_command: false
    systemd: always
  - name: gentoo
    image: docker.io/gwerlas/ansible-guest-gentoo:latest
    pre_build_image: true
    override_command: false
    systemd: always

  # Debian like
  - name: bookworm
    image: docker.io/gwerlas/ansible-guest-debian:bookworm
    pre_build_image: true
    override_command: false
    systemd: always
  - name: trixie
    image: docker.io/gwerlas/ansible-guest-debian:trixie
    pre_build_image: true
    override_command: false
    systemd: always
  - name: jammy
    image: docker.io/gwerlas/ansible-guest-ubuntu:jammy
    pre_build_image: true
    override_command: false
    systemd: always
  - name: noble
    image: docker.io/gwerlas/ansible-guest-ubuntu:noble
    pre_build_image: true
    override_command: false
    systemd: always

  # RedHat like
  - name: centos9s
    image: docker.io/gwerlas/ansible-guest-centos:stream9
    pre_build_image: true
    override_command: false
    systemd: always
  - name: centos10s
    image: docker.io/gwerlas/ansible-guest-centos:stream10
    pre_build_image: true
    override_command: false
    systemd: always
  - name: alma9
    image: docker.io/gwerlas/ansible-guest-almalinux:9
    pre_build_image: true
    override_command: false
    systemd: always
  - name: alma10
    image: docker.io/gwerlas/ansible-guest-almalinux:10
    pre_build_image: true
    override_command: false
    systemd: always
  - name: fedora43
    image: docker.io/gwerlas/ansible-guest-fedora:43
    pre_build_image: true
    override_command: false
    systemd: always
  - name: fedora44
    image: docker.io/gwerlas/ansible-guest-fedora:44
    pre_build_image: true
    override_command: false
    systemd: always
lint: ansible-lint
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_user: ansible
verifier:
  name: ansible
