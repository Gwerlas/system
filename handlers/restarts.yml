---
- name: Reboot is needed
  listen:
    - skip
    - reboot
  ansible.builtin.set_fact:
    system_needs_reboot: true

- name: Apply the network configuration
  listen:
    - restart network service
  when: network_backend.apply is defined
  become: true
  ansible.builtin.command:
    cmd: "{{ network_backend.apply }}"
  changed_when: true

- name: Restart network
  listen:
    - restart network service
  when:
    - network_backend.apply is undefined
    - "'%s' not in network_backend.service"
  become: true
  ansible.builtin.service:
    name: "{{ network_backend.service }}"
    state: restarted

# A `%s` in the service name stands for an interface, and `network_backends` in
# vars/main.yml says why one backend needs that. The substitution is the one
# tasks/networks/template.yml already uses for `template.dest`.
- name: Restart network interfaces
  listen:
    - restart network service
  when:
    - network_backend.apply is undefined
    - "'%s' in network_backend.service"
  become: true
  ansible.builtin.service:
    name: "{{ network_backend.service | format(netiface.name) }}"
    state: restarted
  loop: "{{ system_networks_interfaces }}"
  loop_control:
    loop_var: netiface
    label: "{{ netiface.name }}"

- name: Skip restart
  listen:
    - skip
  ansible.builtin.debug:
    msg: You skipped the network restart or the reboot !

- name: Reload OpenRC
  listen:
    - reload init system
  when: ansible_facts.service_mgr == "openrc"
  become: true
  ansible.builtin.command:
    cmd: telinit u
  changed_when: true

- name: Reload systemd
  listen:
    - reload init system
  when: ansible_facts.service_mgr == "systemd"
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reboot
  listen:
    - reboot
  become: true
  ansible.builtin.reboot:
    reboot_timeout: "{{ system_reboot_timeout }}"
    msg: Reboot initiated by the playbook {{ ansible_play_name }}

- name: Reboot completed
  listen:
    - reboot
  ansible.builtin.set_fact:
    system_needs_reboot: false

- name: Gather facts again
  listen:
    - restart network service
    - reboot
  ansible.builtin.gather_facts:
