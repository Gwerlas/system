---
- name: Facts - Checks
  when: ansible_facts.os_family is undefined
  ansible.builtin.fail:
    msg: Ansible facts must be gathered

# ansible-core <2.20 has a bug in `parse_distribution_file_ClearLinux` that
# claims any /usr/lib/os-release without NAME="Clear Linux ..." (e.g. Gentoo
# with single-quoted NAME='Gentoo') as ClearLinux. Detect the misidentification
# and override the facts before flavors are expanded.
# Fixed upstream in ansible-core 2.20.0:
# https://github.com/ansible/ansible/commit/distribution-clearlinux-pname-else
- name: Facts - Workaround ansible-core <2.20 Gentoo misidentified as ClearLinux
  when: ansible_facts.os_family == 'ClearLinux'
  block:
    - name: Facts - Stat /etc/gentoo-release
      ansible.builtin.stat:
        path: /etc/gentoo-release
      register: gentoo_release

    - name: Facts - Override misdetected distribution facts
      when: gentoo_release.stat.exists
      ansible.builtin.set_fact:
        cacheable: true
        distribution: Gentoo
        os_family: Gentoo
        distribution_release: NA

# Detect a configured Portage binhost so that `system_packages_build: auto`
# can default to "use binhost" when one is present (typical on cloud images
# and Gentoo's catalyst stages) and to "build from source" otherwise.
- name: Facts - Detect Portage binhost
  when: ansible_facts.pkg_mgr == 'portage'
  block:
    - name: Facts - Find binrepos.conf entries
      ansible.builtin.find:
        paths: /etc/portage/binrepos.conf/
        patterns: '*.conf'
      register: binrepos

    - name: Facts - Set has_binhost
      ansible.builtin.set_fact:
        has_binhost: "{{ binrepos.files | length > 0 }}"

# Report and carry on: failing outright would turn a typo into a stopped run.
# What the silence costs is next to `unknown_profiles`, in vars/main.yml.
#
# `warn` rather than `debug` so a typo stands out from the run it converges
# into — see action_plugins/warn.py. It names the host because one line would
# not say which of an inventory is misconfigured.
- name: Facts - Report unknown system_profile segments
  when: unknown_profiles | length > 0
  warn:
    msg: >-
      [{{ inventory_hostname }}] system_profile segment(s)
      {{ unknown_profiles | join(', ') }} match no known profile and are
      ignored (available: {{ profiles.keys() | reject('eq', 'all') | join(', ') }})

- name: Facts - Local variables
  ansible.builtin.include_vars: "{{ file }}"
  vars:
    dir:
      - "{{ role_path }}/vars/"
    flavors:
      - "{{ ansible_facts.pkg_mgr }}"                                                         # apt,           dnf,          etc.
      - "{{ ansible_facts.service_mgr }}"                                                     # openrc,        systemd
      - "{{ ansible_facts.os_family | lower }}-like"                                          # debian-like,   redhat-like,  etc.
      - "{{ ansible_facts.distribution | lower }}"                                            # debian,        fedora,       etc.
      - "{{ ansible_facts.os_family | lower }}{{ ansible_facts.distribution_major_version }}-like"  # redhat7-like,  redhat8-like, etc.
      - "{{ ansible_facts.distribution | lower }}{{ ansible_facts.distribution_major_version }}"    # debian10,      debian11
      - "{{ ansible_facts.distribution | lower }}-{{ ansible_facts.distribution_release | lower }}" # ubuntu-bionic, ubuntu-focal
    ext:
      - .yml
  # Profiles come after the flavors: each file assigns a variable outright,
  # the last one loaded wins, and a profile has to be able to override what
  # the distribution set — `hardened` replacing `vars/debian-like.yml`'s
  # `sshd_config` is the whole point of asking for it.
  with_fileglob: |
    {{
      dir |
      product(flavors + current_profiles) |
      map('join') |
      product(ext) |
      map('join')
    }}
  loop_control:
    loop_var: file

- name: Facts - Global
  vars:
    packages_keys: |
      {{
        ( system_packages_add_by_key + users_shells
        + (current_profiles_values | selectattr('packages', 'defined') | map(attribute='packages'))
        + (current_network_types | selectattr('packages', 'defined') | map(attribute='packages'))
        + (
            (system_manage_networks and system_network_backend != 'auto') |
            ternary(network_backends[system_network_backend].packages | default([]), [])
          )
        + (system_manage_time | ternary([time_backend_name], []))
        + (system_packages_upgrade_unattended | ternary(['unattended-upgrades'], []))
        + (system_ca_certificates | length > 0) | ternary(['ca-certificates'], [])
        + (system_manage_storages | ternary(['parted'], []))
        + (system_manage_lvm | ternary(['lvm2'], []))
        + (system_manage_firewall | ternary(['firewalld'], []))
        ) | flatten | unique | difference(masks.packages | default([]))
      }}
    packages: |
      {{
        (family_packages | default({})) |
        combine(distro_packages | default({})) |
        combine(release_packages | default({}))
      }}
    services_keys: |
      {{
        ( (current_profiles_values | selectattr('services', 'defined') | map(attribute='services'))
        + (system_manage_time | ternary(time_backend.services, []))
        ) | flatten | unique
      }}
    services: |
      {{
        (family_services | default({})) |
        combine(distro_services | default({})) |
        combine(release_services | default({}))
      }}
  ansible.builtin.set_fact:
    cacheable: true
    system_kernel: |-
      {{
        ansible_facts.kernel |
        regex_replace('^(\d[\d.]+)(-p\d+)?.*$', '\1\2') |
        regex_replace('-p(\d+)$', '_p\1')
      }}
    system_mounts: |
      {{
        ((
          (
            (system_storages_partitions | selectattr('state', 'undefined')) +
            (system_storages_partitions | selectattr('state', 'defined') | selectattr('state', '==', 'present'))
          ) |
          to_json | from_json |
          community.general.json_query('[?mount].{
            fstype: not_null(fs_type, `ext4`),
            group: not_null(group, `root`),
            mode: not_null(mode, `0755`),
            owner: not_null(owner, `root`),
            path: mount,
            resize: not_null(resize, `false`),
            src: join(``, [device, to_string(not_null(number, `1`))])
          }')
        ) + (
          (
            (system_storages_lvol | selectattr('state', 'undefined')) +
            (system_storages_lvol | selectattr('state', 'defined') | selectattr('state', '==', 'present'))
          ) |
          to_json | from_json |
          community.general.json_query('[?mount].{
            fstype: not_null(fstype, `ext4`),
            group: not_null(group, `root`),
            mode: not_null(mode, `0755`),
            owner: not_null(owner, `root`),
            path: mount,
            resize: not_null(resizefs, `true`),
            src: join(`/`, [``, `dev`, `mapper`, join(`-`, [vg, lv])])
          }')
        )) | sort(attribute='path')
      }}
    system_needs_reboot: "{{ system_needs_reboot | default(false) }}"
    system_packages: |
      {{
        ( system_packages_add_by_name
        + (packages_add_by_name | default([]))
        + (packages_keys | intersect(packages.keys()) | map('extract', packages))
        + (packages_keys | difference(packages.keys()))
        ) | flatten | sort | unique
      }}
    system_shells: "{{ users_shells }}"
    system_services_dict: "{{ services }}"
    system_services: |
      {{
        ( (services_keys | intersect(services.keys()) | map('extract', services))
        + (services_keys | difference(services.keys()))
        ) | flatten | sort | unique
      }}

- name: Facts - Installed packages
  ansible.builtin.package_facts:

# NetworkManager reads two formats, and the directory is what separates them:
# EL10 and Fedora dropped /etc/sysconfig/network-scripts, so NetworkManager
# without it is on keyfiles — which this role does not write yet, and reports.
- name: Facts - Stat the sysconfig network scripts directory
  ansible.builtin.stat:
    path: /etc/sysconfig/network-scripts
  register: sysconfig_network_scripts

# The name of the format the host is already configured through. Resolved even
# when `system_network_backend` names one, so a mismatch can be reported with
# both halves. It may name a format the role does not implement — that is the
# point: the host is told what it runs instead of being silently skipped.
#
# Read off installed packages, which package_facts has already gathered, rather
# than off running services, which would cost a second fact pass. A host
# running something other than what it has installed names its backend rather
# than relying on this.
- name: Facts - Detect the network backend
  ansible.builtin.set_fact:
    cacheable: true
    detected_network_backend: |-
      {{
        'netifrc' if 'netifrc' in ansible_facts.packages
        else 'netplan' if 'netplan.io' in ansible_facts.packages
        else (
          'sysconfig' if sysconfig_network_scripts.stat.exists else 'keyfile'
        ) if network_manager_packages | select('in', ansible_facts.packages) | length > 0
        else 'eni' if 'ifupdown' in ansible_facts.packages
        else 'networkd'
      }}

- name: Unconfined facts
  when: not in_container
  block:
    - name: Facts - Stat /sys/firmware/efi
      ansible.builtin.stat:
        path: /sys/firmware/efi
      register: result

    - name: Facts - Autodetections
      ansible.builtin.set_fact:
        system_uptime: "{{ (ansible_facts.date_time.epoch | int) - ansible_facts.uptime_seconds }}"
        system_boot_mode: "{{ result.stat.exists | ternary('efi', 'pc') }}"
        cacheable: true

    # `auto` takes the flavour from the installed packages, then follows the
    # binhost policy: sys-kernel/gentoo-kernel gets the `-bin` suffix when
    # system_portage_use_bin_suffix is set, so a cloud image with a binhost
    # doesn't spend 45 minutes compiling a kernel while every other package
    # comes from the binhost. The suffix is only ever added, never removed —
    # dropping it would trade that compile back in. Only gentoo-kernel is
    # matched because it is the only sys-kernel package with a `-bin`
    # counterpart: vanilla-kernel and every `*-sources` flavour have none, and
    # suffixing them would build an atom Portage cannot resolve.
    - name: Facts - Autodetect installed kernel package
      when:
        - ansible_facts.pkg_mgr == 'portage'
        - system_portage_kernel == 'auto'
      vars:
        # Sorted: several sys-kernel packages can be installed side by side
        # (gentoo-kernel and gentoo-kernel-bin coexist), and package facts
        # carry no order, so an unsorted pick would be arbitrary.
        current_kernel: >-
          {{
            ansible_facts.packages.values() |
            flatten |
            json_query("[?category=='sys-kernel' && (name.contains(@, '-kernel') || name.contains(@, '-sources'))]") |
            map(attribute='name') |
            sort |
            first
          }}
        bin_suffix: "{{ system_portage_use_bin_suffix and current_kernel == 'gentoo-kernel' }}"
      ansible.builtin.set_fact:
        system_portage_kernel: "{{ current_kernel }}{{ bin_suffix | bool | ternary('-bin', '') }}"
        cacheable: true
