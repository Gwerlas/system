---
- name: Package managers
  tags:
    - package-managers
  block:
    - name: Package managers - Load facts
      when: system_packages is undefined
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/tasks/facts.yml"

    # Also tagged `proxies` so that changing a proxy reaches the repositories.
    # A dynamic include is filtered like any other task, and skipping it hides
    # everything it would have included; the tag is what opens the descent. It
    # does not propagate — an `include_tasks` tag applies to the include alone
    # — so a `-t proxies` run reaches only the tasks tagged `proxies` below and
    # leaves the rest of the package manager configuration untouched.
    - name: Package managers - Configuration
      tags:
        - proxies
      vars:
        task_file: "{{ role_path }}/tasks/package-managers/{{ ansible_facts.pkg_mgr }}/configure.yml"
      when: task_file is file
      ansible.builtin.include_tasks:
        file: "{{ task_file }}"

    - name: Package managers - Cache update
      ansible.builtin.include_tasks:
        file: "{{ pkg_mgr_task }}"
      with_first_found:
        - files:
            - update.yml
          paths:
            - "{{ role_path }}/tasks/package-managers/{{ ansible_facts.pkg_mgr }}"
            - "{{ role_path }}/tasks/package-managers/other"
      loop_control:
        loop_var: pkg_mgr_task

    - name: Take effects immediatly
      ansible.builtin.meta: flush_handlers
