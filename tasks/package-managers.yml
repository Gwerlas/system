---
- name: Package managers
  tags:
    - package-managers
  block:
    - name: Package managers - Load facts
      when: system_packages is undefined
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/tasks/facts.yml"

    # Tagged `proxies` too, so that changing a proxy reaches the repositories.
    # The tag is what opens the descent, and it opens nothing more: "If you add
    # tags to an include, they apply only to the include itself, not to any
    # tasks in the included file or role."
    # https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_tags.html#tag-inheritance-for-includes-blocks-and-the-apply-keyword
    - name: Package managers - Configuration
      tags:
        - proxies
      vars:
        task_file: "{{ role_path }}/tasks/package-managers/{{ ansible_facts.pkg_mgr }}/configure.yml"
      when: task_file is file
      ansible.builtin.include_tasks:
        file: "{{ task_file }}"

    - name: Package managers - Cache update
      ansible.builtin.include_tasks:
        file: "{{ pkg_mgr_task }}"
      with_first_found:
        - files:
            - update.yml
          paths:
            - "{{ role_path }}/tasks/package-managers/{{ ansible_facts.pkg_mgr }}"
            - "{{ role_path }}/tasks/package-managers/other"
      loop_control:
        loop_var: pkg_mgr_task

    - name: Take effects immediatly
      ansible.builtin.meta: flush_handlers
