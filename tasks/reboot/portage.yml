---
- name: Portage - Installed/updated packages during this boot
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/packages/portage/installed-this-boot.yml"

# The atoms live here once: `system_needs_reboot` is their union, and every
# trigger reads its own by key. A trigger the fact does not cover is then
# impossible to write — a key absent from this mapping fails the task instead
# of quietly reporting a reboot-free host (#21).
#
# One task per trigger rather than a loop: a looped task notifies the handlers
# of every item as soon as one item is changed, so `grub-install` would fire
# on a glibc-only upgrade.
- name: Portage - Reboot triggers
  vars:
    triggers:
      grub: sys-boot/grub
      service_mgr: sys-apps/{{ ansible_facts.service_mgr }}
      glibc: sys-libs/glibc
      kernel: sys-kernel/{{ system_portage_kernel }}
      firmware: sys-kernel/linux-firmware
  block:
    # Computed here rather than left to the `Reboot is needed` handler, which
    # runs at the next flush — too late for a caller reading the fact in the
    # same play.
    - name: Portage - Set fact system_needs_reboot
      vars:
        moved: >-
          {{ triggers.values() | select('in', installed_this_boot.stdout) }}
      ansible.builtin.set_fact:
        system_needs_reboot: "{{ (moved | length) > 0 }}"

    - name: Portage - Grub
      vars:
        atom: "{{ triggers.grub }}"
        has_changed: "{{ atom in installed_this_boot.stdout }}"
      ansible.builtin.debug:
        msg: >-
          {{ atom }} {{ has_changed | ternary('has', "hasn't") }} changed
      changed_when: has_changed
      notify:
        - grub-install
        - "{{ system_reboot_handler }}"

    - name: Portage - Service manager
      vars:
        atom: "{{ triggers.service_mgr }}"
        has_changed: "{{ atom in installed_this_boot.stdout }}"
      ansible.builtin.debug:
        msg: >-
          {{ atom }} {{ has_changed | ternary('has', "hasn't") }} changed
      changed_when: has_changed
      notify: "{{ system_reboot_handler }}"

    - name: Portage - Glibc
      vars:
        atom: "{{ triggers.glibc }}"
        has_changed: "{{ atom in installed_this_boot.stdout }}"
      ansible.builtin.debug:
        msg: >-
          {{ atom }} {{ has_changed | ternary('has', "hasn't") }} changed
      changed_when: has_changed
      notify:
        - reload init system
        - "{{ system_reboot_handler }}"

    - name: Portage - Kernel
      vars:
        atom: "{{ triggers.kernel }}"
        has_changed: "{{ atom in installed_this_boot.stdout }}"
      ansible.builtin.debug:
        msg: >-
          {{ atom }} {{ has_changed | ternary('has', "hasn't") }} changed
      changed_when: has_changed
      notify:
        - eclean-kernel
        - grub-mkconfig
        - "{{ system_reboot_handler }}"

    - name: Portage - Linux firmware
      vars:
        atom: "{{ triggers.firmware }}"
        has_changed: "{{ atom in installed_this_boot.stdout }}"
      ansible.builtin.debug:
        msg: >-
          {{ atom }} {{ has_changed | ternary('has', "hasn't") }} changed
      changed_when: has_changed
      notify:
        - regenerate initramfs
        - grub-mkconfig
        - "{{ system_reboot_handler }}"
