---
- name: Portage - Before install - Get the latest kernel version
  check_mode: false
  ansible.builtin.command:
    cmd: portageq best_visible / sys-kernel/{{ system_portage_kernel }}
  register: result
  changed_when: false

- name: Portage - Before install - Latest available kernel fact
  ansible.builtin.set_fact:
    system_latest_kernel: "{{ result.stdout | regex_replace('^.*-(\\d[^-]+(?:-r\\d+)?)\\s*$', '\\1') }}"

# Seed /etc/portage/savedconfig/sys-kernel/<pkg>-<ver> when missing —
# see docs/packages.md "Kernel" section for the carry-over → /proc/config.gz
# → upstream-default chain.
- name: Portage - Before install - Seed kernel savedconfig
  when: system_portage_kernel is search('-kernel')
  vars:
    savedconfig_dir: /etc/portage/savedconfig/sys-kernel
    savedconfig_file: "{{ savedconfig_dir }}/{{ system_portage_kernel }}-{{ system_latest_kernel }}"
  block:
    - name: Portage - Before install - Existing kernel savedconfigs
      ansible.builtin.find:
        paths: "{{ savedconfig_dir }}"
        patterns: "{{ system_portage_kernel }}-*"
      register: kernel_savedconfigs

    - name: Portage - Before install - Carry over previous kernel savedconfig
      when:
        - kernel_savedconfigs.matched > 0
        - savedconfig_file not in (kernel_savedconfigs.files | map(attribute='path'))
      become: true
      vars:
        previous_savedconfig: >-
          {{ savedconfig_dir }}/{{ system_portage_kernel }}-{{
            kernel_savedconfigs.files | map(attribute='path') | map('basename')
            | map('regex_replace', '^' ~ system_portage_kernel ~ '-', '')
            | community.general.version_sort | last
          }}
      ansible.builtin.copy:
        src: "{{ previous_savedconfig }}"
        dest: "{{ savedconfig_file }}"
        remote_src: true
        mode: "0644"

    - name: Portage - Before install - Running kernel config availability
      when: kernel_savedconfigs.matched == 0
      ansible.builtin.stat:
        path: /proc/config.gz
      register: proc_config

    - name: Portage - Before install - Bootstrap kernel savedconfig from /proc/config.gz
      when:
        - kernel_savedconfigs.matched == 0
        - proc_config.stat.exists | default(false)
      become: true
      ansible.builtin.shell:
        cmd: set -o pipefail && zcat /proc/config.gz > {{ savedconfig_file }}
        creates: "{{ savedconfig_file }}"
        executable: /bin/bash

# Two dist-kernel flavours cannot share a version: they both install
# /usr/src/linux-<ver>, Portage declares no blocker between them, and `@world`
# slot-upgrades each installed flavour on its own, so they meet at the next
# version bump and the merge dies on the collision (#34).
#
# Before the emerge below, not after it: when the flavour being replaced sits
# at the version we are about to install, the collision hits that emerge itself
# and there is no "after". What that costs the operator is in docs/packages.md.
- name: Portage - Before install - Keep a single dist kernel flavour
  when: system_portage_kernel is search('-kernel')
  block:
    - name: Portage - Before install - Installed sys-kernel packages
      check_mode: false
      ansible.builtin.command:
        cmd: qlist -IC sys-kernel/
      register: installed_sys_kernel
      changed_when: false

    # `-kernel` in the package name is the dist-kernel naming (gentoo-kernel,
    # gentoo-kernel-bin, vanilla-kernel, gentoo-kernel-modprep) and the test
    # the role already uses for the flavour; `*-sources` fall outside it.
    - name: Portage - Before install - Remove the other dist kernel flavours
      when: other_flavours | length > 0
      become: true
      vars:
        other_flavours: >-
          {{
            installed_sys_kernel.stdout_lines
            | map('basename')
            | select('search', '-kernel')
            | reject('eq', system_portage_kernel)
            | map('regex_replace', '^', 'sys-kernel/')
          }}
      community.general.portage:
        package: "{{ other_flavours }}"
        state: absent
      # An unmerged dist-kernel leaves its /boot entry and its modules behind,
      # unowned and still listed by the bootloader; eclean-kernel is what
      # prunes them.
      notify: eclean-kernel

# Emerge the chosen flavour first, oneshot so the version-slotted package never
# lands in world (see docs/packages.md "Kernel" for why @world is anchored on
# virtual/dist-kernel instead). Going before virtual/dist-kernel lets the next
# task resolve against an already-installed dist-kernel — otherwise Portage
# would pull its own default flavour, not necessarily system_portage_kernel.
- name: Portage - Before install - Dist kernel
  become: true
  community.general.portage:
    update: "{{ system_packages_upgrade }}"
    oneshot: true
    package: sys-kernel/{{ system_portage_kernel }}
  notify:
    - etc-update savedconfig
    - emerge @module-rebuild
    - "{{ system_reboot_handler }}"

# Anchor @world on virtual/dist-kernel (it pulls the matching gentoo-kernel as a
# dependency — already installed by the task above) along with the companions.
#
# dev-python/zstandard is not in app-admin/eclean-kernel's RDEPEND, but
# eclean-kernel needs it here: its `std` layout probes every versioned file in
# /boot to recognise kernel images, decompressing anything that starts with a
# known compression magic, and a dist-kernel initramfs is zstd. The resulting
# MissingDecompressorError is not caught, so the `eclean-kernel` handler exits 1
# and takes the play down. It only bites when the initramfs carries no
# early-CPIO microcode prefix — a prefix keeps the zstd magic away from offset 0
# and eclean-kernel skips the file — which is why the failure looks intermittent
# from one host to another.
- name: Portage - Before install - Dist kernel packages
  become: true
  community.general.portage:
    update: "{{ system_packages_upgrade }}"
    package:
      - app-admin/eclean-kernel
      - dev-python/zstandard
      - sys-kernel/linux-firmware
      - virtual/dist-kernel
  notify:
    - etc-update savedconfig
    - emerge @module-rebuild
    - "{{ system_reboot_handler }}"

# Dist-kernels (sys-kernel/*-kernel) don't have the 'symlink' USE flag (it only
# exists on *-sources). Their pkg_postinst only updates /usr/src/linux when the
# old target is being replaced, so it leaves the symlink on a previously
# installed kernel. Point it at the latest ourselves so @module-rebuild and
# out-of-tree modules build against the right tree.
#
# The directory name carries the flavour's KV_LOCALVERSION, which the role has
# no way to know: gentoo-kernel installs linux-<ver>-gentoo-dist,
# gentoo-kernel-bin linux-<ver>-gentoo-dist-bin, vanilla-kernel plain
# linux-<ver>. Look the directory up instead of spelling it, and fail here on a
# miss rather than leave a dangling symlink that only breaks later, in whatever
# needs the sources (#36). One flavour is installed at a time, so one version
# means one directory. system_latest_kernel keeps the _pN suffix (e.g.
# 7.0.10_p1) while the directory uses -pN (linux-7.0.10-p1-gentoo-dist).
- name: Portage - Before install - Kernel sources
  when: system_portage_kernel is search('-kernel')
  vars:
    source_version: "{{ system_latest_kernel | replace('_p', '-p') }}"
  block:
    - name: Portage - Before install - Find the installed source tree
      ansible.builtin.find:
        paths: /usr/src
        file_type: directory
        patterns:
          - linux-{{ source_version }}
          - linux-{{ source_version }}-*
      register: kernel_sources

    - name: Portage - Before install - Exactly one source tree
      ansible.builtin.assert:
        that: kernel_sources.matched == 1
        fail_msg: >-
          /usr/src holds {{ kernel_sources.matched }} source trees for kernel
          {{ source_version }}, expected exactly one
        quiet: true

    - name: Portage - Before install - Dist kernel symlink
      become: true
      ansible.builtin.file:
        src: "{{ kernel_sources.files[0].path | basename }}"
        dest: /usr/src/linux
        state: link
        follow: false
        force: true
      notify:
        - emerge @module-rebuild
