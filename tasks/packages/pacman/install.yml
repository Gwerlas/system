---
- name: Become root
  become: true
  block:
    - name: Pacman - Install
      community.general.pacman:
        name: "{{ system_packages }}"
  rescue:
    - name: Pacman - Install rescue
      ansible.builtin.command:
        cmd: pacman -Syu --noconfirm {{ system_packages | join(' ') }}
      register: result
      changed_when: not 'there is nothing to do' in result.stdout
