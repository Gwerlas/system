---
# Only touches CFLAGS / CPU_FLAGS_* / CAMERAS / SANE_BACKENDS / VIDEO_CARDS
# when the user opts in to build-from-source. With packages_build=false
# (Gentoo binhost mode and default for other distros), keep these unset so
# the binhost binpkgs remain USE-flag compatible.
- name: Hardware support
  when:
    - not in_container
    - packages_build
  block:
    - name: Portage - make.conf - cpuid2cpuflags tool
      become: true
      community.general.portage:
        package: app-portage/cpuid2cpuflags

    - name: Portage - make.conf - Get CPU flags
      ansible.builtin.command:
        cmd: cpuid2cpuflags
      register: cpuid2cpuflags
      changed_when: false
      check_mode: false

    # cpuid2cpuflags 18 prefixes its output with the `*/*` atom, 17 does not:
    # https://wiki.gentoo.org/wiki/CPU_FLAGS_*#Using_cpuid2cpuflags
    - name: Portage - package.use - CPU flags
      become: true
      ansible.builtin.copy:
        content: "*/* {{ cpuid2cpuflags.stdout | regex_replace('^\\*/\\* ', '') }}\n"
        dest: /etc/portage/package.use/00cpu-flags
        group: portage
        mode: "0664"
      notify: emerge --newuse

    - name: Portage - make.conf - CPU flags moved to package.use
      become: true
      ansible.builtin.lineinfile:
        dest: /etc/portage/make.conf
        regexp: ^CPU_FLAGS_[A-Z0-9_]+=
        state: absent
      notify: emerge --newuse

    - name: Portage - make.conf - Hardware support
      become: true
      when: line.value | length > 0
      ansible.builtin.lineinfile:
        dest: /etc/portage/make.conf
        line: '{{ line.key }}="{{ line.value }}"'
        regexp: "^{{ line.key | regex_escape }}="
        insertafter: "{{ line.insertafter | default(omit) }}"
        insertbefore: "{{ line.insertbefore | default(omit) }}"
        firstmatch: "{{ 'insertbefore' in line }}"
        state: "{{ line.state | default(omit) }}"
      loop:
        - key: COMMON_FLAGS
          value: "{{ system_packages_build_cflags }}"
          insertbefore: CFLAGS
        - key: CFLAGS
          value: ${COMMON_FLAGS}
        - key: CXXFLAGS
          value: ${COMMON_FLAGS}
          insertafter: CFLAGS
        - key: FCFLAGS
          value: ${COMMON_FLAGS}
          insertafter: CXXFLAGS
        - key: FFLAGS
          value: ${COMMON_FLAGS}
          insertafter: FCFLAGS
        - key: CAMERAS
          value: "{{ system_portage_cameras | join(' ') }}"
          state: "{{ in_container | ternary('absent', 'present') }}"
        - key: SANE_BACKENDS
          value: "{{ system_portage_sane_backends | join(' ') }}"
          state: "{{ in_container | ternary('absent', 'present') }}"
        - key: VIDEO_CARDS
          value: "{{ system_portage_video_cards | join(' ') }}"
          state: "{{ in_container | ternary('absent', 'present') }}"
      notify: emerge --newuse
      loop_control:
        loop_var: line

- name: Portage - make.conf - Get installed Python versions
  ansible.builtin.command:
    cmd: equery -q list -F '$slot' dev-lang/python
  changed_when: false
  check_mode: false
  register: equery

- name: Become root
  become: true
  block:
    - name: Portage - make.conf - Common settings
      when: line.value | length > 0
      ansible.builtin.lineinfile:
        dest: /etc/portage/make.conf
        line: '{{ line.key }}="{{ line.value }}"'
        regexp: "^{{ line.key | regex_escape }}="
        insertafter: "{{ line.insertafter | default(omit) }}"
        insertbefore: "{{ line.insertbefore | default(omit) }}"
        firstmatch: "{{ 'insertbefore' in line }}"
      loop:
        - key: ACCEPT_KEYWORDS
          value: "{{ portage_accept_keywords | join(' ') }}"
        - key: L10N
          value: "{{ system_l10n | join(' ') }}"
        - key: EMERGE_DEFAULT_OPTS
          value: "{{ portage_opts | join(' ') | trim }}"
        - key: FEATURES
          value: "{{ (['${FEATURES}'] + portage_features) | join(' ') | regex_replace('\\s+', ' ') }}"
        - key: PORTAGE_LOGDIR
          value: "{{ system_portage_logdir }}"
        - key: GENTOO_MIRRORS
          value: "{{ system_portage_gentoo_mirrors | join(' ') }}"
        - key: PYTHON_TARGETS
          value: |-
            {{
              system_portage_python_targets |
              default([]) |
              join(' ')
            }}
        - key: PYTHON_SINGLE_TARGET
          value: "{{ system_portage_python_single_target | default('') }}"
          insertafter: PYTHON_TARGETS
        - key: RUBY_TARGETS
          value: |-
            {{
              system_portage_ruby_targets |
              default([]) |
              join(' ')
            }}
      notify: emerge --newuse
      loop_control:
        loop_var: line

    - name: Portage - make.conf - Logs directory
      when: system_portage_logdir | length > 0
      ansible.builtin.file:
        path: "{{ system_portage_logdir }}"
        state: directory
        owner: portage
        group: portage
        mode: "2770"

    - name: Portage - make.conf - Configuration files
      ansible.builtin.template:
        src: portage/{{ file }}.j2
        dest: /etc/portage/{{ file }}
        group: portage
        mode: "0664"
      loop:
        - package.license/kernels
        - package.use/firewalld
        - package.use/kernel
        - package.use/lvm2
      loop_control:
        loop_var: file
      notify: emerge --newuse

    - name: Packages - make.conf - Gnome
      when: "'gnome' in current_profiles"
      ansible.builtin.lineinfile:
        path: /etc/conf.d/display-manager
        line: DISPLAYMANAGER="gdm"
        regexp: ^DISPLAYMANAGER=
        create: true
        group: portage
        mode: "0664"
      notify:
        - restart display-manager
