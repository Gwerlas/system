---
- name: Networks
  tags:
    - networks
  block:
    - name: Networks - Load variables
      when: detected_network_backend is undefined
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/facts.yml"

    # Silence would leave an inventory believing the role still sweeps the
    # directory, which it did until this variable went away.
    - name: Networks - Refuse a removed variable
      when:
        - system_networks_interfaces_prune is defined
        - system_networks_interfaces_prune is truthy
      ansible.builtin.fail:
        msg: >-
          system_networks_interfaces_prune has been removed: the role no longer
          deletes interface configuration it did not write. Drop the variable;
          docs/networks.md says what changes instead.

    # Every name the detection can return has an entry today, so this guards
    # the interval between teaching the detection a format and writing its
    # backend. It sits inside the block rather than above it because a host
    # managing no interface and rebooting to apply changes never resolves a
    # backend at all, and has to keep converging.
    - name: Networks - Check the backend is implemented
      when:
        - system_manage_networks or
          system_networks_restart_handler == 'restart network service'
        - network_backend_name not in network_backends
      ansible.builtin.fail:
        msg: >-
          This role has no '{{ network_backend_name }}' network backend
          {{ 'detected on this host' if system_network_backend == 'auto'
             else 'asked for through system_network_backend' }}.
          Implemented: {{ network_backends.keys() | sort | join(', ') }}.

    - name: Networks - IPv6 support
      become: true
      ansible.posix.sysctl:
        key: net.ipv6.conf.all.disable_ipv6
        value: "{{ system_networks_disable_ipv6 | ternary('1', omit) }}"
        state: "{{ system_networks_disable_ipv6 | ternary('present', 'absent') }}"
      notify: "{{ system_networks_restart_handler }}"

    - name: Networks - Interfaces
      when:
        - system_manage_networks
        - system_networks_interfaces | length > 0
      block:
        - name: Networks - Backend rules
          ansible.builtin.include_tasks:
            file: "{{ file }}"
          with_first_found:
            - files:
                - "{{ network_backend_name }}.yml"
              paths:
                - "{{ role_path }}/tasks/networks"
              skip: true
          loop_control:
            loop_var: file

        - name: Networks - Interfaces configuration from template
          when: network_backend.template is defined
          ansible.builtin.include_tasks: "{{ role_path }}/tasks/networks/template.yml"
